# ============================================================
#  kitty.conf - configuracao pessoal (Victor)
#  Fonte: JetBrainsMono Nerd Font | Tema: Catppuccin Mocha
# ============================================================

# ---------- Fonte ----------
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
# Ajuste fino do espacamento entre linhas/celulas (0 = padrao)
adjust_line_height  110%
disable_ligatures never

# ---------- Cursor ----------
cursor_shape           beam
cursor_beam_thickness  1.6
cursor_blink_interval  0.5
cursor_stop_blinking_after 15.0

# ---------- Scrollback ----------
scrollback_lines 20000
wheel_scroll_multiplier 5.0

# ---------- Mouse ----------
mouse_hide_wait 3.0
copy_on_select yes
strip_trailing_spaces smart

# ---------- Janela / aparencia ----------
window_padding_width 10
background_opacity 0.95
dynamic_background_opacity yes
confirm_os_window_close 0
remember_window_size  yes
initial_window_width  110c
initial_window_height 30c
hide_window_decorations no

# ---------- Abas ----------
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{index}: {title}"
active_tab_font_style   bold

# ---------- Som ----------
enable_audio_bell no
visual_bell_duration 0.0

# ---------- Performance ----------
repaint_delay    8
input_delay      2
sync_to_monitor  yes

# ---------- URLs ----------
url_style curly
detect_urls yes

# ============================================================
#  Tema: Catppuccin Mocha
# ============================================================
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

cursor                  #f5e0dc
cursor_text_color       #1e1e2e

url_color               #f5e0dc

active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f9e2af

active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825

# normal
color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de
# bright
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

# ============================================================
#  Atalhos (esquema pessoal - foco em 2 teclas, mao direita)
#  IMPORTANTE: nada de comentario no fim de linha 'map' (quebra launch).
# ============================================================
enabled_layouts splits,stack

# ----- Abas -----
# nova aba
map ctrl+n           new_tab
# fechar aba atual
map ctrl+delete      close_tab
# Alt+' circula abas / Alt+1..4 vai direto
map alt+apostrophe   next_tab
map alt+1            goto_tab 1
map alt+2            goto_tab 2
map alt+3            goto_tab 3
map alt+4            goto_tab 4

# ----- Copiar / colar -----
# copia se houver selecao, senao envia Ctrl+C (interromper)
map ctrl+c           copy_or_interrupt
map ctrl+v           paste_from_clipboard

# ----- Fonte / zoom -----
map ctrl+equal       change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+0           change_font_size all 0

# ----- Splits (dividir a janela) -----
# novo split / horizontal / vertical (sem comentario no fim da linha!)
map alt+enter        new_window
map alt+d            launch --location=hsplit
map alt+r            launch --location=vsplit
# Navegar entre splits com Alt+setas
map alt+left         neighboring_window left
map alt+down         neighboring_window down
map alt+up           neighboring_window up
map alt+right        neighboring_window right
# Alternativa vim: Alt+HJKL
map alt+h            neighboring_window left
map alt+j            neighboring_window down
map alt+k            neighboring_window up
map alt+l            neighboring_window right

# ----- Scrollback / busca -----
map ctrl+shift+g     show_scrollback
map ctrl+shift+f     show_scrollback

# ----- Util -----
# limpar a tela (rola ate o cursor)
map ctrl+shift+k     clear_terminal to_cursor active
# recarregar config
map ctrl+shift+f5    load_config_file
# abrir URL da tela pelo teclado
map ctrl+shift+e     open_url_with_hints
