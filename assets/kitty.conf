# ============================================================
#  kitty.conf - configuracao pessoal (Victor)
#  Fonte: JetBrainsMono Nerd Font | Tema: Catppuccin Mocha
# ============================================================

# ---------- Fonte ----------
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
# Ajuste fino do espacamento entre linhas/celulas (0 = padrao)
adjust_line_height  110%
disable_ligatures never

# ---------- Cursor ----------
cursor_shape           beam
cursor_beam_thickness  1.6
cursor_blink_interval  0.5
cursor_stop_blinking_after 15.0

# ---------- Scrollback ----------
scrollback_lines 20000
wheel_scroll_multiplier 5.0

# ---------- Mouse ----------
mouse_hide_wait 3.0
copy_on_select yes
strip_trailing_spaces smart

# ---------- Janela / aparencia ----------
window_padding_width 10
background_opacity 0.95
dynamic_background_opacity yes
confirm_os_window_close 0
remember_window_size  yes
initial_window_width  110c
initial_window_height 30c
hide_window_decorations no

# ---------- Abas ----------
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{index}: {title}"
active_tab_font_style   bold

# ---------- Som ----------
enable_audio_bell no
visual_bell_duration 0.0

# ---------- Performance ----------
repaint_delay    8
input_delay      2
sync_to_monitor  yes

# ---------- URLs ----------
url_style curly
detect_urls yes

# ============================================================
#  Tema: Catppuccin Mocha
# ============================================================
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

cursor                  #f5e0dc
cursor_text_color       #1e1e2e

url_color               #f5e0dc

active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f9e2af

active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825

# normal
color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de
# bright
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

# ============================================================
#  Atalhos uteis (mantendo os padroes + alguns extras)
# ============================================================
# Copiar/colar
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Aumentar/diminuir fonte
map ctrl+shift+equal  change_font_size all +1.0
map ctrl+shift+minus  change_font_size all -1.0
map ctrl+shift+0      change_font_size all 0

# Abas
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab

# Splits (janelas dentro da aba) - layout
enabled_layouts splits,stack
map ctrl+shift+enter new_window
map ctrl+shift+d launch --location=hsplit
map ctrl+shift+r launch --location=vsplit
# Navegar entre splits
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right

# Ajustar opacidade em tempo real
map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05

# Recarregar config
map ctrl+shift+f5 load_config_file

# ============================================================
#  Atalhos com HYPER (= Shift DIREITO remapeado via Remap_shift_right.sh)
#  Permite atalhos de 2 teclas. Os ctrl+shift acima continuam como fallback
#  (uteis em Wayland, onde o remapeamento xmodmap nao se aplica).
# ============================================================
# Copiar/colar
map hyper+c copy_to_clipboard
map hyper+v paste_from_clipboard
# Abas
map hyper+t new_tab
map hyper+w close_tab
map hyper+right next_tab
map hyper+left  previous_tab
# Fonte
map hyper+equal change_font_size all +1.0
map hyper+minus change_font_size all -1.0
map hyper+0     change_font_size all 0
# Splits
map hyper+enter new_window
map hyper+d launch --location=hsplit
map hyper+r launch --location=vsplit
map hyper+j neighboring_window down
map hyper+k neighboring_window up
map hyper+h neighboring_window left
map hyper+l neighboring_window right
# Scrollback / busca
map hyper+g show_scrollback
map hyper+f launch --type=overlay --stdin-source=@screen_scrollback /usr/bin/less +G -R
# Recarregar
map hyper+f5 load_config_file
