# ============================================================
#  kitty.conf - configuracao pessoal (Victor)
#  Fonte: JetBrainsMono Nerd Font | Tema: Catppuccin Mocha
# ============================================================

# ---------- Fonte ----------
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
# Ajuste fino do espacamento entre linhas/celulas (0 = padrao/natural da fonte,
# equivalente ao cell-height-scale=1.0 / cell-width-scale=1.0 do GNOME Terminal)
adjust_line_height  0
adjust_column_width 0
disable_ligatures never

# ---------- Cursor ----------
cursor_shape           beam
cursor_beam_thickness  1.6
cursor_blink_interval  0.5
cursor_stop_blinking_after 15.0

# ---------- Scrollback ----------
scrollback_lines 20000
wheel_scroll_multiplier 5.0

# ---------- Mouse ----------
mouse_hide_wait 3.0
copy_on_select yes
strip_trailing_spaces smart

# ---------- Janela / aparencia ----------
window_padding_width 10
background_opacity 0.95
dynamic_background_opacity yes
confirm_os_window_close 0
remember_window_size  yes
initial_window_width  110c
initial_window_height 30c
hide_window_decorations no

# ---------- Abas ----------
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{index}: {title}"
active_tab_font_style   bold

# ---------- Som ----------
enable_audio_bell no
visual_bell_duration 0.0

# ---------- Performance ----------
repaint_delay    8
input_delay      2
sync_to_monitor  yes

# ---------- URLs ----------
url_style curly
detect_urls yes

# ============================================================
#  Tema: Catppuccin Mocha
# ============================================================
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

cursor                  #f5e0dc
cursor_text_color       #1e1e2e

url_color               #f5e0dc

active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f9e2af

active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825

# normal
color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de
# bright
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

# ============================================================
#  MODO DE MAPEAMENTO so para SPLITS (leader mode, estilo tmux)
#  Alt+S entra no MODO SPLITS. Dentro dele as teclas repetem sem
#  reapertar a lider. Esc ou Enter sai do modo.
#  Abas sao atalhos diretos (Ctrl+N, Ctrl+Delete, Alt+', Alt+1..4).
# ============================================================
enabled_layouts splits,stack

# --------- MODO SPLITS: entra com Alt+S ---------
map --new-mode splits alt+s push_keyboard_mode splits
# criar novo split com Alt+seta (esq/dir = lado a lado; cima/baixo = em linha)
map --mode splits alt+left   launch --location=vsplit
map --mode splits alt+right  launch --location=vsplit
map --mode splits alt+up     launch --location=hsplit
map --mode splits alt+down   launch --location=hsplit
# fechar
map --mode splits c          close_window
# navegar (setas ou hjkl) - repetivel dentro do modo
map --mode splits left       neighboring_window left
map --mode splits down       neighboring_window down
map --mode splits up         neighboring_window up
map --mode splits right      neighboring_window right
map --mode splits h          neighboring_window left
map --mode splits j          neighboring_window down
map --mode splits k          neighboring_window up
map --mode splits l          neighboring_window right
# mover o split de posicao (Shift+setas dentro do modo)
map --mode splits shift+left   move_window left
map --mode splits shift+down   move_window down
map --mode splits shift+up     move_window up
map --mode splits shift+right  move_window right
# zoom (maximiza/restaura)
map --mode splits z          toggle_layout stack
# sair do modo
map --mode splits esc pop_keyboard_mode
map --mode splits enter pop_keyboard_mode

# --------- ABAS: atalhos diretos (sem modo) ---------
# Ctrl+N nova aba | Ctrl+Delete fecha | Alt+' cicla | Alt+1..4 direto
map ctrl+n           new_tab
map ctrl+delete      close_tab
map alt+apostrophe   next_tab
map alt+1            goto_tab 1
map alt+2            goto_tab 2
map alt+3            goto_tab 3
map alt+4            goto_tab 4

# ============================================================
#  Atalhos diretos (sem lider) - acoes rapidas do dia a dia
# ============================================================
# Copiar / colar (selecao com mouse ja copia)
map ctrl+c           copy_or_interrupt
map ctrl+v           paste_from_clipboard
# Fonte / zoom
map ctrl+equal       change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+0           change_font_size all 0
# Scrollback / busca
map ctrl+shift+g     show_scrollback
map ctrl+shift+f     show_scrollback
# Limpar a tela
map ctrl+shift+k     clear_terminal to_cursor active
# Recarregar config
map ctrl+shift+f5    load_config_file
# Abrir URL da tela pelo teclado
map ctrl+shift+e     open_url_with_hints

